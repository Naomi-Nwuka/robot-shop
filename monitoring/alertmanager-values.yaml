alertmanager:
  config:
    route:
      receiver: "null"
      group_by: [alertname, instance]
      group_wait: 30s
      group_interval: 1m
      repeat_interval: 4h
      routes:
        - receiver: slack
          matchers:
            - 'team="capstone"'
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook/url
            send_resolved: true
            title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }}
              Runbook: {{ .Annotations.runbook_url }}
              {{ end }}
  alertmanagerSpec:
    secrets:
      - slack-webhook
